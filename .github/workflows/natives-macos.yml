# The macOS native libraries Deadwax carries (libcdio, libcdio-paranoia,
# libFLAC), built from the pinned sources on an Apple silicon runner by
# tools/build-natives/macos.sh, and kept as an artifact for
# tools/release-natives.sh to attach to the natives-N release. Not an app
# build; run by hand when tools/build-natives/pins.sh changes.
name: Natives (macOS)

on:
  workflow_dispatch:
  push:
    paths: ["tools/build-natives/**", ".github/workflows/natives-macos.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build tools only (nothing from Homebrew ships)
        run: brew install cmake pkg-config
      - name: Build
        run: tools/build-natives/macos.sh
      - name: Package
        run: |
          cd native/osx-arm64 && zip -9 -q ../../natives-osx-arm64.zip *.dylib natives-build-info.txt && cd ../..
          shasum -a 256 natives-osx-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: natives-osx-arm64
          path: natives-osx-arm64.zip
          retention-days: 30
