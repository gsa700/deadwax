# Deadwax on the three platforms it is heading for: build, test, and publish
# the single-file program for each, and its Native AOT build (the road to 0.8). Linux is where it rips today; the Windows
# and macOS builds prove the managed code and the per-platform library names
# compile and start, ahead of the native bundles and the subchannel reader that
# make them rip. Artifacts, not releases (tools/release.sh cuts those).
name: Build

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "Deadwax.slnx", ".github/workflows/build.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "Deadwax.slnx", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # No native libraries to install: Deadwax talks to the drive with its own
      # code on every platform since 0.7.4.
      - name: Build
        run: dotnet build Deadwax.slnx -c Release -nologo -v quiet

      - name: Test
        run: dotnet test tests/Deadwax.Tests -c Release --no-build -nologo -v quiet

      - name: Publish ${{ matrix.rid }} single file
        run: dotnet publish src/Deadwax.App -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out -nologo -v quiet

      - name: Smoke test, ten seconds alive (macOS)
        if: runner.os == 'macOS'
        run: |
          # No headless mode; the runner has a window server, so the window
          # opens and says "Put a CD in the drive". Alive after ten seconds =
          # Avalonia and its native libraries loaded. The timer's own exit code is the pass.
          set +e
          perl -e 'alarm 10; exec @ARGV' ./out/Deadwax > smoke.log 2>&1
          rc=$?
          set -e
          echo "exit code $rc (124, 137 or 142 = killed by the timer = alive = pass)"
          cat smoke.log
          test "$rc" -eq 142 -o "$rc" -eq 124 -o "$rc" -eq 137

      - name: Smoke test, ten seconds alive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\out\Deadwax.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Host "exited early with $($p.ExitCode)"; exit 1 }
          Write-Host "alive after ten seconds = pass"
          Stop-Process -Id $p.Id -Force

      - name: Package
        shell: bash
        run: |
          cd out
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a -bd ../Deadwax-${{ matrix.rid }}.zip Deadwax.exe >/dev/null; else zip -9 -q ../Deadwax-${{ matrix.rid }}.zip Deadwax; fi
          cd ..
          ls -la Deadwax-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Deadwax-${{ matrix.rid }}
          path: |
            Deadwax-${{ matrix.rid }}.zip
            smoke.log
          if-no-files-found: ignore
          retention-days: 30

      # Native AOT (the road to 0.8): the app and the CLI compiled ahead of
      # time, on the runner of their own system, because AOT cannot build for
      # another one. Not shipped yet; the single file above still is. Fails on
      # any trim or AOT warning (IL2xxx/IL3xxx): such code may break only in
      # the compiled build, where no test runs it.
      - name: Native AOT tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q clang zlib1g-dev

      - name: Publish ${{ matrix.rid }} Native AOT
        shell: bash
        run: |
          # Two folders: Deadwax (the app) and deadwax (the CLI) are one name
          # on Windows and macOS, and the second build would replace the first.
          for p in App:out-aot Cli:out-aot-cli; do
            dotnet publish src/Deadwax.${p%%:*} -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o ${p#*:} -nologo -v minimal 2>&1 | tee -a aot.log
            test "${PIPESTATUS[0]}" -eq 0
          done
          if grep -E "warning IL[0-9]+" aot.log; then echo "trim/AOT warnings above"; exit 1; fi
          ls -la out-aot out-aot-cli

      - name: Smoke test Native AOT (macOS)
        if: runner.os == 'macOS'
        run: |
          ./out-aot-cli/deadwax 2>&1 | grep -q "^usage:"
          set +e
          perl -e 'alarm 10; exec @ARGV' ./out-aot/Deadwax > smoke-aot.log 2>&1
          rc=$?
          set -e
          echo "exit code $rc (124, 137 or 142 = killed by the timer = alive = pass)"
          cat smoke-aot.log
          test "$rc" -eq 142 -o "$rc" -eq 124 -o "$rc" -eq 137

      - name: Smoke test Native AOT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $usage = & .\out-aot-cli\deadwax.exe 2>&1 | Out-String
          if ($usage -notmatch '(?m)^usage:') { Write-Host $usage; exit 1 }
          $global:LASTEXITCODE = 0   # usage exits 2; the step's wrapper would take that as a failure
          $p = Start-Process -FilePath .\out-aot\Deadwax.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Host "exited early with $($p.ExitCode)"; exit 1 }
          Write-Host "alive after ten seconds = pass"
          Stop-Process -Id $p.Id -Force

      - name: Smoke test Native AOT CLI (Linux)
        if: runner.os == 'Linux'
        run: ./out-aot-cli/deadwax 2>&1 | grep -q "^usage:"

      - name: Package Native AOT
        shell: bash
        run: |
          # The app, and the CLI in a folder of its own (for testing; releases
          # do not carry it).
          rm -rf out-aot/*.pdb out-aot/*.dbg out-aot/*.dSYM out-aot-cli/*.pdb out-aot-cli/*.dbg out-aot-cli/*.dSYM
          mv out-aot-cli out-aot/cli
          cd out-aot
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a -bd ../Deadwax-aot-${{ matrix.rid }}.zip . >/dev/null; else zip -9 -q -r ../Deadwax-aot-${{ matrix.rid }}.zip .; fi
          cd ..
          ls -la Deadwax-aot-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Deadwax-aot-${{ matrix.rid }}
          path: |
            Deadwax-aot-${{ matrix.rid }}.zip
            smoke-aot.log
          if-no-files-found: ignore
          retention-days: 30
